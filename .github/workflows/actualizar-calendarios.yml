name: Actualizar calendarios

on:
  schedule:
    # Lunes y viernes a las 17:05, hora de Madrid (GitHub aplica solo el horario de verano/invierno).
    # 17:05 y no 17:00 en punto: GitHub recomienda evitar el minuto 0, que es cuando más se retrasa.
    - cron: "5 17 * * 1,5"
      timezone: "Europe/Madrid"
    # Respaldo: si GitHub retrasa o se salta la de las 17:05, esta la cubre. Si ya se hizo, no repite nada.
    - cron: "45 18 * * 1,5"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      modo:
        description: "Tipo de comprobación"
        type: choice
        options: [manual, lunes, viernes]
        default: manual
      probar_email:
        description: "Solo enviar un email de prueba"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendarios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Email de prueba
        if: ${{ inputs.probar_email }}
        run: python -m fbmcal --probar-email

      - name: Pruebas automáticas (si fallan, no se toca ningún calendario)
        if: ${{ !inputs.probar_email }}
        run: python -m unittest discover -s tests -t .

      - name: Consultar la FBM y actualizar calendarios
        if: ${{ !inputs.probar_email }}
        run: |
          owner="${{ github.repository_owner }}"
          export PAGES_URL="https://${owner,,}.github.io/${{ github.event.repository.name }}/"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m fbmcal --modo auto --programado
          else
            python -m fbmcal --modo "${{ inputs.modo }}"
          fi

      - name: Guardar estado y calendarios en el repositorio
        if: ${{ !inputs.probar_email }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -m "Calendarios actualizados $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push

      - name: Preparar publicación
        if: ${{ !inputs.probar_email && hashFiles('docs/index.html') != '' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publicar:
    needs: actualizar
    if: ${{ !inputs.probar_email }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
