name: Actualizar calendarios

# Los calendarios NO necesitan secretos: usan solo el token automático de GitHub (GITHUB_TOKEN).
# Los avisos de Telegram (opcionales) usan los secrets TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID, que solo
# se entregan a los pasos de Telegram, y se envían en el último trabajo, DESPUÉS de publicar.
# Orden: datos FBM → verificar → conciliar → generar calendarios → publicar → Telegram.

on:
  schedule:
    # COMPROBACIÓN DE LAS 17:00 DEL LUNES Y DEL VIERNES (hora de Madrid).
    # GitHub retrasa mucho las tareas programadas (de 4 a 7 horas en sep-nov 2026) y a veces se salta
    # alguna. Por eso hay un intento CADA HORA los lunes y viernes desde las 11:05 UTC, y el programa
    # (que trabaja en hora de Madrid) solo actúa con el primero que llegue a partir de las 17:00 y una
    # sola vez al día; los demás terminan enseguida sin hacer nada ni publicar.
    # Horas en UTC: con «timezone:» GitHub no disparó ninguna ejecución el 25/09/2026.
    - cron: "5 11-22 * * 1,5"
    # Recuperación: si la comprobación del lunes o del viernes no llegó a hacerse antes de medianoche,
    # estos intentos de madrugada del martes y del sábado (hasta las 08:00 de Madrid) la hacen.
    - cron: "5 0-5 * * 2,6"
  workflow_dispatch:
    inputs:
      modo:
        description: "Tipo de comprobación"
        type: choice
        options: [manual, lunes, viernes]
        default: manual
      probar_aviso:
        description: "Solo crear un aviso de prueba (Issue)"
        type: boolean
        default: false
      probar_telegram:
        description: "Solo enviar un mensaje de prueba por Telegram"
        type: boolean
        default: false

permissions:
  contents: write   # guardar data/estado.json y docs/
  pages: write      # publicar en GitHub Pages
  id-token: write   # requerido por GitHub Pages
  issues: write     # avisos de cambios y errores

concurrency:
  group: calendarios
  cancel-in-progress: false

env:
  AVISO_ARCHIVO: /tmp/aviso-calendarios.md
  ERROR_ARCHIVO: /tmp/error-calendarios.txt
  GH_TOKEN: ${{ github.token }}
  TITULO_ERROR: "❌ Error en la actualización de los calendarios"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      actualizado: ${{ steps.consultar.outputs.actualizado }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aviso de prueba
        if: ${{ inputs.probar_aviso }}
        run: python -m fbmcal --probar-aviso

      - name: Pruebas automáticas (si fallan, no se toca ningún calendario)
        if: ${{ !inputs.probar_aviso && !inputs.probar_telegram }}
        env:
          AVISO_ARCHIVO: ""   # las pruebas nunca deben generar avisos reales
        run: python -m unittest discover -s tests -t .

      - name: Consultar la FBM y actualizar calendarios
        id: consultar
        if: ${{ !inputs.probar_aviso && !inputs.probar_telegram }}
        run: |
          rm -f "$AVISO_ARCHIVO" "$ERROR_ARCHIVO"
          owner="${{ github.repository_owner }}"
          export PAGES_URL="https://${owner,,}.github.io/${{ github.event.repository.name }}/"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m fbmcal --modo auto --programado
          else
            python -m fbmcal --modo "${{ inputs.modo }}"
          fi

      - name: Guardar estado y calendarios en el repositorio
        if: ${{ !inputs.probar_aviso && !inputs.probar_telegram }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Sin cambios que guardar"; exit 0; fi
          git commit -m "Calendarios actualizados $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push

      - name: Preparar publicación
        if: ${{ !inputs.probar_aviso && !inputs.probar_telegram && steps.consultar.outputs.actualizado == 'true' && hashFiles('docs/index.html') != '' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      # Los avisos son secundarios: si GitHub Issues fallara, NO deben impedir publicar los calendarios.
      - name: Crear aviso de cambios (Issue)
        continue-on-error: true
        run: |
          if [ -s "$AVISO_ARCHIVO" ]; then
            titulo="$(head -n 1 "$AVISO_ARCHIVO")"
            tail -n +2 "$AVISO_ARCHIVO" > /tmp/cuerpo.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body-file /tmp/cuerpo.md
          else
            echo "Sin novedades que avisar."
          fi

      - name: Cerrar el aviso de error anterior (ya funciona)
        if: ${{ !inputs.probar_aviso && !inputs.probar_telegram }}
        continue-on-error: true
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Error en la actualización in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "✅ Resuelto: la ejecución ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ha funcionado."
          done

      - name: Aviso de error (Telegram)
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fbmcal.telegram error --causa "Ha fallado un paso de la actualización (ver GitHub Actions)."

      - name: Aviso de error (Issue)
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          texto="La actualización ha fallado. **No se ha modificado ningún calendario**: siguen publicados los de la última ejecución correcta. Se reintentará en la próxima ejecución programada.

          Detalles: $url"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Error en la actualización in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Ha vuelto a fallar: $url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO_ERROR" --body "$texto"
          fi

  publicar:
    needs: actualizar
    # Solo se publica cuando se ha hecho una comprobación (los intentos que no tocan no redespliegan).
    if: ${{ !inputs.probar_aviso && !inputs.probar_telegram && needs.actualizar.outputs.actualizado == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Avisos de Telegram: SIEMPRE después de publicar y sin poder hacer fallar la actualización.
  # Si Telegram no responde o faltan los secrets, los avisos quedan en data/telegram.json y se
  # reintentan en la siguiente ejecución.
  telegram:
    needs: [actualizar, publicar]
    if: ${{ always() && !inputs.probar_aviso && needs.actualizar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # incluye la cola que acaba de guardar el trabajo «actualizar»

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prueba de Telegram
        if: ${{ inputs.probar_telegram }}
        run: python -m fbmcal.telegram prueba

      - name: Aviso si la publicación en GitHub Pages ha fallado
        if: ${{ !inputs.probar_telegram && needs.publicar.result == 'failure' }}
        run: python -m fbmcal.telegram error --causa "Los calendarios se generaron, pero GitHub Pages no pudo publicarlos. Siguen visibles los anteriores."

      - name: Enviar avisos pendientes
        if: ${{ !inputs.probar_telegram }}
        run: python -m fbmcal.telegram enviar

      - name: Guardar registro de avisos enviados
        if: ${{ !inputs.probar_telegram }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then echo "Sin cambios en la cola"; exit 0; fi
          git commit -m "Avisos de Telegram enviados $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          for intento in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::warning::No se pudo guardar el registro de avisos enviados."
